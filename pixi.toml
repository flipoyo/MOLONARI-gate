# MOLONARI-gate (molonari.io): deployment notes, server and website, and `molosite`, the sync of the WordPress site.
[workspace]
name = "molonari-gate"
version = "0.2.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"
git = "*"
requests = "*"
markdown-it-py = "*"
jinja2 = "*"
pytest = "*"
responses = "*"
setuptools = ">=68"

[pypi-dependencies]
molosite = { path = ".", editable = true }

[tasks]
# SemVer of this repository: pixi.toml is the reference, see scripts/bump_version.py
bump-version = "python scripts/bump_version.py"
check-version = "python scripts/bump_version.py --check"
# The sync of molonari.io: pixi run site plan | push | pull | check
site = "molosite"
site-plan = "molosite plan"
site-check = "molosite check"
test = "python -m pytest"
test-all = { depends-on = ["check-version", "test", "site-check"] }
