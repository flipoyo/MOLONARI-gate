# The page map of molonari.io. `pixi run site pull` fills the pages; the owner then sets each page's mode:
#   generated = rendered from MOLONARI1D CGS-MOLO, managed = raw blocks in website/pages/, editorial = WordPress only.
base_url = "https://molonari.io"
branch = "CGS-MOLO"
cgs_file = ".config/molonari.cgs"
cgs_variants = [".config/molonari.cgs", ".config/molonari-light.cgs", ".config/simu-direct.cgs", ".config/install-orx.cgs"]

[sections]
recompose = "README.md#Recompose the Operating Space"
admin = "README.md#Administration with pixi"

[roles]
"." = "MOLONARI1D: the entry point. It recomposes the Operating Space, is administered with pixi, and carries the project guides."
"Molonaviz" = "MOLONARI-API: the Molonaviz application, the receiver and the database."
"data" = "MOLO-data-light: the project data, with the laboratory metadata, the raw measurements kept unmodified and the processed data."
"hardware" = "MOLONARI-hardware: the sensors, the datalogger and the network around them, as documentation and code."
"molonari.io" = "MOLONARI-gate: this website, its server and deployment, and the molosite tool that keeps the site in step with this branch."
"computo" = "MOLONARI-computo: from temperatures measured in a river bed to the water flowing through it, with its uncertainty."

